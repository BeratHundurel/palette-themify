services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-themesmith}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-api:
    image: golang:1.26.2-alpine
    working_dir: /app
    command: sh -c "go mod download && go run ."
    volumes:
      - ./api/go:/app
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-themesmith}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_LOG_LEVEL: ${DB_LOG_LEVEL:-warn}
      APP_ENV: ${APP_ENV:-development}
      GIN_MODE: ${GIN_MODE:-debug}
      HTTP_HOST: 0.0.0.0
      PORT: "${GO_API_PORT:-8088}"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://wails.localhost:9245}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8088/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-themesmith-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${GO_API_PORT:-8088}:${GO_API_PORT:-8088}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  zig-api:
    build:
      context: ./api/zig
      dockerfile: Dockerfile
    working_dir: /app
    command: zig build run --cache-dir /tmp/zig-local-cache --global-cache-dir /tmp/zig-global-cache
    volumes:
      - ./api/zig:/app
    environment:
      ZIG_LOCAL_CACHE_DIR: /tmp/zig-local-cache
      ZIG_GLOBAL_CACHE_DIR: /tmp/zig-global-cache
      PORT: "${ZIG_API_PORT:-8089}"
      MAX_BODY_SIZE_MB: "${MAX_BODY_SIZE_MB:-50}"
      ALLOWED_ORIGIN: ${ZIG_ALLOWED_ORIGIN:-*}
    ports:
      - "${ZIG_API_PORT:-8089}:${ZIG_API_PORT:-8089}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8089/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8088}
      VITE_ZIG_API_BASE_URL: ${VITE_ZIG_API_BASE_URL:-http://localhost:8089}
      VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-false}
      VITE_APP_ENV: ${APP_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - go-api
      - zig-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
